# Quidra Vision package metadata - the single source of truth.
#
# Every value below is authored here exactly once. quidra.package is generated
# from this file by Core's `quidra package sync`; do not hand-edit it. Core's
# package parser is the single implementation of the accepted metadata subset.

[package]
name = "quidra-vision"
import = "vision"
display_name = "Quidra Vision"
version = "0.5.0"
repository = "https://github.com/quidra-lang/vision"

[requires]
quidra = ">=0.5.0 <0.6.0"
abi = 1
math = ">=0.5.0 <0.6.0"

# Package-owned CPU implementation. Core only provides the generic native
# extension ABI/build mechanism; Vision owns this kernel.
[native.source]
cpu = "native/vision_native.cpp"
codecs = "native/image_codec.cpp"

# Package-owned Metal kernels. Core lends its command queue and tensor buffers
# through the native-extension ABI; Vision owns the image-domain kernels.
[native.source.macos-arm64]
metal = "native/vision_metal.mm"

[native.source.macos-x86_64]
metal = "native/vision_metal.mm"

# Codec dependencies stay Vision-owned. Core only resolves generic package-native
# dependency metadata through pkg-config.
[native.pkg]
png = "libpng"
jpeg = "libjpeg"
tiff = "libtiff-4"
webp = "libwebp"
