name: real-gpu-hardware

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Hardware backend to validate
        required: true
        default: nvidia
        type: choice
        options:
          - nvidia
          - amd
          - all
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/real-gpu-hardware.yml"
      - "main.qui"
      - "tests/real_gpu_integration.sh"

concurrency:
  group: vision-real-gpu-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvidia:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'nvidia' || inputs.backend == 'all')) ||
      (github.event_name == 'push' && vars.QUIDRA_NVIDIA_GPU_CI == '1')
    runs-on: [self-hosted, linux, x64, quidra-nvidia]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: v0.2.0
          path: quidra
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Build Quidra
        run: cmake -S quidra -B quidra/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON && cmake --build quidra/build --parallel
      - name: Require NVIDIA hardware and run Vision numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "NVIDIA"
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"

  amd:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'amd' || inputs.backend == 'all')) ||
      (github.event_name == 'push' && vars.QUIDRA_AMD_GPU_CI == '1')
    runs-on: [self-hosted, linux, x64, quidra-amd]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: v0.2.0
          path: quidra
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Build Quidra
        run: cmake -S quidra -B quidra/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON && cmake --build quidra/build --parallel
      - name: Require AMD hardware and run Vision numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "AMD"
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
