name: ci

on:
  push:
  pull_request:

jobs:
  feature-core:
    name: Quidra develop compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - name: Enforce synchronized first-party versions
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          versions = {
              "vision": tomllib.loads(Path("project.toml").read_text())["package"]["version"],
              "quidra": tomllib.loads(Path("quidra/project.toml").read_text())["project"]["version"],
              "math": tomllib.loads(Path("math/project.toml").read_text())["package"]["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"first-party versions must match: {versions}")
          PY
      - name: Enforce Core native ABI boundary
        run: python3 quidra/tests/package_native_boundary_tests.py .
      - name: Restore Quidra compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-quidra-${{ hashFiles('quidra/CMakeLists.txt', 'quidra/src/**', 'quidra/include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-quidra-

      - name: Install Quidra toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache clang llvm libcurl4-openssl-dev
      - name: Install Vision native dependencies
        run: bash scripts/install-linux-native-deps.sh
      - name: Build Quidra develop
        run: cmake -S quidra -B quidra/build -DCMAKE_BUILD_TYPE=Release -DQUIDRA_ENABLE_TEST_GPU_BACKEND=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build quidra/build --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
      - name: Validate package metadata with Core
        run: quidra/build/quidra package validate "$GITHUB_WORKSPACE"
      - name: Install package through the package manager
        env:
          HOME: ${{ runner.temp }}/quidra-home
        run: |
          quidra/build/quidra install "$GITHUB_WORKSPACE/math"
          quidra/build/quidra install "$GITHUB_WORKSPACE"
      - name: Integration tests
        run: bash tests/integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Vision AOT package-native contract
        run: bash tests/aot.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Develop autograd contracts
        run: bash tests/develop_autograd.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Boundary and property tests
        run: bash tests/boundary.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Device placement contracts
        run: bash tests/device.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Real GPU numerical integration when available
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
      - name: Check example
        env:
          QUIDRA_PACKAGE_PATH: ${{ github.workspace }}/..:${{ github.workspace }}
        run: quidra/build/quidra check examples/process.qui


  metal-real-gpu:
    name: Metal real GPU integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - name: Restore Quidra compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-quidra-${{ hashFiles('quidra/CMakeLists.txt', 'quidra/src/**', 'quidra/include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-quidra-

      - name: Install Quidra dependencies
        run: brew install ccache curl pkg-config libpng jpeg-turbo libtiff webp
      - name: Build Quidra develop
        run: cmake -S quidra -B quidra/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libpng);$(brew --prefix jpeg-turbo);$(brew --prefix libtiff);$(brew --prefix webp);$(brew --prefix)" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache && cmake --build quidra/build --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
      - name: Real Metal GPU numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "Metal"
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
